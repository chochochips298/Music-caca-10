<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferissa Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0a0c;
    --bg-1:#88226448;
    --surface:#18181c;
    --surface-2:#1f1f24;
    --line:rgba(255,255,255,.07);
    --text:#f3f0f0;
    --text-dim:#a3a0a6;
    --text-faint:#6f6c73;
    --accent:#ff3d78;
    --accent-soft:rgba(255,61,120,.16);
    --gold:#e7c88f;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,61,120,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(231,200,143,.08), transparent 55%),
      var(--bg-0);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
  }

  .app-shell{
    width:100%;
    max-width:1100px;
    height:min(88vh,720px);
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:24px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    overflow:hidden;
    box-shadow:0 40px 80px rgba(0,0,0,.55);
  }
  .now-playing{
    padding:44px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    border-right:1px solid var(--line);
    overflow:hidden;
  }

  .brand{
    position:absolute;
    top:28px;
    left:48px;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
  .brand span{color:var(--accent);}

  .art-wrap{
    position:relative;
    width:min(58%,260px);
    aspect-ratio:1/1;
    margin-bottom:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    overflow:hidden;
  }
  .art-glow{
    position:absolute;
    inset:-30px;
    background:radial-gradient(circle,var(--accent-soft),transparent 70%);
    filter:blur(6px);
    opacity:.85;
    transition:opacity .5s;
    border-radius:50%;
  }
  .art-wrap:not(.is-playing) .art-glow{opacity:.25;}

  .album-cover{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 0 6px var(--surface-2), 0 0 0 7px var(--line);
    position:relative;
    z-index:1;
    transition: transform 0.1s linear;
  }
  .rotate{animation:spin 8s linear infinite;}
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  #songTitle{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    line-height:1.25;
  }
  #artistName{
    margin:0 0 22px;
    color:var(--text-dim);
    font-size:14px;
    letter-spacing:.02em;
  }

  .eq{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:16px;
    margin-bottom:22px;
  }
  .eq span{
    width:3px;
    background:var(--accent);
    border-radius:2px;
    height:4px;
    opacity:.35;
  }
  .art-wrap.is-playing ~ .eq span{opacity:1;animation:bounce 1.1s ease-in-out infinite;}
  .eq span:nth-child(1){animation-delay:0s;}
  .eq span:nth-child(2){animation-delay:.15s;}
  .eq span:nth-child(3){animation-delay:.3s;}
  .eq span:nth-child(4){animation-delay:.45s;}
  @keyframes bounce{0%,100%{height:4px;}50%{height:16px;}}

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:26px;
  }
  button{
    border:none;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:hover{transform:scale(1.08);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:50%;}

  #prevButton,#nextButton{
    width:40px;height:40px;
    font-size:16px;
    color:var(--text-dim);
  }
  #prevButton:hover,#nextButton:hover{color:var(--text);}

  #playButton{
    width:62px;height:62px;
    border-radius:50%;
    background:var(--accent);
    color:#1a0912;
    font-size:20px;
    box-shadow:0 10px 24px rgba(255,61,120,.35);
  }
  #playButton:hover{background:#ff5a8c;}

  .progress-wrap{width:100%;max-width:340px;}
  #progressBar{
    width:100%;
    appearance:none;
    height:4px;
    border-radius:4px;
    background:var(--surface-2);
    cursor:pointer;
    outline:none;
  }
  #progressBar::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--text);
    box-shadow:0 0 0 3px rgba(255,255,255,.08);
    cursor:pointer;
    margin-top:-5px;
    transition: transform .15s ease;
  }
  #progressBar::-webkit-slider-thumb:hover{
    transform: scale(1.15);
  }
  #progressBar::-webkit-slider-runnable-track{
    height:4px;
    border-radius:4px;
    background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--pct,0%),var(--surface-2) var(--pct,0%));
  }
  #progressBar::-moz-range-thumb{
    width:14px;
    height:14px;
    border:none;
    border-radius:50%;
    background:var(--text);
    box-shadow:0 0 0 3px rgba(255,255,255,.08);
    cursor:pointer;
  }
  #progressBar::-moz-range-track{
    height:4px;
    border-radius:4px;
    background:var(--surface-2);
  }
  #progressBar::-moz-range-progress{
    height:4px;
    border-radius:4px;
    background:var(--accent);
  }

  .time{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:.03em;
  }

 
  .queue-panel{
    padding:36px 30px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .queue-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    flex-shrink:0;
  }
  .queue-header h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0;
  }
  .queue-header span{
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:.05em;
    text-transform:uppercase;
  }

  .playlist{
    overflow-y:auto;
    margin:0 -8px;
    padding:0 8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .playlist::-webkit-scrollbar{width:6px;}
  .playlist::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px;}

  .song{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:12px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .18s ease;
  }
  .song:hover{background:var(--surface);}
  .song.active{
    background:var(--accent-soft);
    border-left:2px solid var(--accent);
  }
  .song-index{
    width:20px;
    font-size:12px;
    color:var(--text-faint);
    text-align:center;
    flex-shrink:0;
  }
  .song.active .song-index{color:var(--accent);}
  .song-info b{
    display:block;
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    margin-bottom:2px;
  }
  .song-info small{
    font-size:11.5px;
    color:var(--text-dim);
  }

  @media (max-width:860px){
    body{padding:0;align-items:flex-start;}
    .app-shell{
      max-width:100%;
      height:auto;
      min-height:100vh;
      border-radius:0;
      grid-template-columns:1fr;
    }
    .now-playing{
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:64px 28px 32px;
    }
    .queue-panel{padding:24px 20px 32px;}
    .playlist{max-height:44vh;}
  }

  @media (max-width:420px){
    #songTitle{font-size:22px;}
    .art-wrap{width:70%;}
  }
</style>
</head>
<body>

<div class="app-shell">

  <section class="now-playing">
    <div class="brand">Ferissa<span>.</span>Music</div>

    <div class="art-wrap" id="artWrap">
      <div class="art-glow"></div>
      <img src="foto2.JPG" id="coverImage" class="album-cover"
           onerror="this.src='https://placehold.co/260x260/18181c/e7c88f?text=%E2%99%AB'">
    </div>

    <h1 id="songTitle">The One That Got Away</h1>
    <p id="artistName">Katy Perry</p>

    <div class="eq"><span></span><span></span><span></span><span></span></div>

    <div class="controls">
      <button id="prevButton" aria-label="Previous song">⏮</button>
      <button id="playButton" aria-label="Play">▶</button>
      <button id="nextButton" aria-label="Next song">⏭</button>
    </div>

    <audio id="audioPlayer" src="lagu 2.mp3"></audio>

    <div class="progress-wrap">
      <input type="range" id="progressBar" value="0" min="0" max="100">
      <div class="time">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>
  </section>

  <section class="queue-panel">
    <div class="queue-header">
      <h2>Playlist</h2>
      <span id="queueCount">6 songs</span>
    </div>
    <div class="playlist" id="playlist"></div>
  </section>

</div>

<script>
 const songs = [
  { title:"Merry Christmas, i miss you", artist:"Alex Crichton", image:"foto1.webp", music:"lagu 1.mp3" },
  { title:"The One That Got Away", artist:"Katy Perry", image:"foto2.jpg", music:"lagu 2.mp3" },
  { title:"Sedia Aku Sebelum Hujan", artist:"Idgitaf", image:"foto3.webp", music:"lagu 3.mp3" },
  { title:"Di Ujung Jalan", artist:"Samsons", image:"foto4.webp", music:"lagu 4.mp3" },
  { title:"Seandainya", artist:"Vierratale", image:"foto5.webp", music:"lagu 5.mp3" },
  { title:"About You", artist:"The 1975", image:"foto6.JPG", music:"lagu 6.mp3" },
  { title:"Our To Keep", artist:"Kendis feat Adis", image:"foto7.JPG", music:"lagu 7.mp3" },
  { title:"End of Beginning", artist:"Djo", image:"foto8.JPG", music:"lagu 8.mp3" },
  { title:"Take A Chance With Me", artist:"NIKI", image:"foto9.JPG", music:"lagu 9.mp3" },
  { title:"Where We Are", artist:"One Direction", image:"foto10.JPG", music:"lagu 10.mp3" }
];

  const audioPlayer   = document.getElementById("audioPlayer");
  const songTitle     = document.getElementById("songTitle");
  const artistName    = document.getElementById("artistName");
  const coverImage    = document.getElementById("coverImage");
  const artWrap       = document.getElementById("artWrap");
  const playButton    = document.getElementById("playButton");
  const prevButton    = document.getElementById("prevButton");
  const nextButton    = document.getElementById("nextButton");
  const progressBar   = document.getElementById("progressBar");
  const playlistEl    = document.getElementById("playlist");
  const currentTimeEl = document.getElementById("currentTime");
  const durationEl    = document.getElementById("duration");
  const queueCount    = document.getElementById("queueCount");

  let currentSong = 0;

  function renderPlaylist(){
    playlistEl.innerHTML = "";
    queueCount.textContent = songs.length + (songs.length === 1 ? " song" : " songs");
    songs.forEach(function(song, index){
      const item = document.createElement("div");
      item.className = "song";
      item.onclick = function(){ selectSong(index); };
      item.innerHTML =
        '<div class="song-index">' + (index + 1) + '</div>' +
        '<div class="song-info"><b>' + song.title + '</b><small>' + song.artist + '</small></div>';
      playlistEl.appendChild(item);
    });
    highlightActiveSong();
  }

  function highlightActiveSong(){
    const items = document.querySelectorAll(".song");
    items.forEach(function(item, index){
      item.classList.toggle("active", index === currentSong);
    });
  }

  function loadSong(){
    songTitle.innerHTML = songs[currentSong].title;
    artistName.innerHTML = songs[currentSong].artist;
    coverImage.src = songs[currentSong].image;
    audioPlayer.src = songs[currentSong].music;

    progressBar.value = 0;
    progressBar.style.setProperty("--pct", "0%");
    currentTimeEl.innerHTML = "00:00";
    durationEl.innerHTML = "00:00";

    highlightActiveSong();
  }

  function playSong(){
    audioPlayer.play().catch(function(){
      playButton.innerHTML = "▶";
      artWrap.classList.remove("is-playing");
      coverImage.classList.remove("rotate");
    });
    playButton.innerHTML = "⏸";
    artWrap.classList.add("is-playing");
    coverImage.classList.add("rotate");
  }

  playButton.addEventListener("click", function(){
    if(audioPlayer.paused){
      playSong();
    }else{
      audioPlayer.pause();
      playButton.innerHTML = "▶";
      artWrap.classList.remove("is-playing");
      coverImage.classList.remove("rotate");
    }
  });

  nextButton.addEventListener("click", function(){
    currentSong++;
    if(currentSong >= songs.length){ currentSong = 0; }
    loadSong();
    playSong();
  });

  prevButton.addEventListener("click", function(){
    currentSong--;
    if(currentSong < 0){ currentSong = songs.length - 1; }
    loadSong();
    playSong();
  });

  function selectSong(index){
    currentSong = index;
    loadSong();
    playSong();
  }

  audioPlayer.addEventListener("ended", function(){
    nextButton.click();
  });

  audioPlayer.addEventListener("timeupdate", function(){
    let currentMinute = Math.floor(audioPlayer.currentTime / 60);
    let currentSecond = Math.floor(audioPlayer.currentTime % 60);
    if(currentSecond < 10){ currentSecond = "0" + currentSecond; }
    currentTimeEl.innerHTML = currentMinute + ":" + currentSecond;

    if(!isNaN(audioPlayer.duration)){
      let progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progressBar.value = progress;
      progressBar.style.setProperty("--pct", progress + "%");
    }
  });

  progressBar.addEventListener("input", function(){
    if(!isNaN(audioPlayer.duration)){
      audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
    }
    progressBar.style.setProperty("--pct", progressBar.value + "%");
  });

  audioPlayer.addEventListener("loadedmetadata", function(){
    let minute = Math.floor(audioPlayer.duration / 60);
    let second = Math.floor(audioPlayer.duration % 60);
    if(second < 10){ second = "0" + second; }
    durationEl.innerHTML = minute + ":" + second;
  });

  renderPlaylist();
  loadSong();
</script>
</body>
</html>
