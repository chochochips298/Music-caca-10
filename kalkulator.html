<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }
        .calculator {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            width: 320px;
        }
        .display {
            background: #1e293b;
            color: white;
            padding: 20px 24px;
            border-radius: 12px;
            text-align: right;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 20px;
            min-height: 72px;
            word-break: break-all;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 18px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #f1f5f9;
            color: #0f172a;
            transition: 0.15s ease;
            font-weight: 500;
        }
        button:hover {
            background: #e2e8f0;
        }
        button:active {
            transform: scale(0.94);
        }
        .operator {
            background: #f97316;
            color: white;
        }
        .operator:hover {
            background: #ea580c;
        }
        .equal {
            background: #3b82f6;
            color: white;
        }
        .equal:hover {
            background: #2563eb;
        }
        .clear {
            background: #ef4444;
            color: white;
        }
        .clear:hover {
            background: #dc2626;
        }
        .number {
            background: #f8fafc;
        }
        .number:hover {
            background: #e2e8f0;
        }
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
        .span-two {
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">

        <button class="clear" id="clear">C</button>
        <button class="operator" id="divide">÷</button>
        <button class="operator" id="multiply">×</button>
        <button class="operator" id="subtract">−</button>

        <button class="number" id="7">7</button>
        <button class="number" id="8">8</button>
        <button class="number" id="9">9</button>
        <button class="operator" id="add">+</button>

        <button class="number" id="4">4</button>
        <button class="number" id="5">5</button>
        <button class="number" id="6">6</button>
        <button class="equal" id="equals">=</button>

        <button class="number" id="1">1</button>
        <button class="number" id="2">2</button>
        <button class="number" id="3">3</button>
        <button class="operator" id="backspace">⌫</button>

        <button class="number span-two" id="0">0</button>
        <button class="number" id="decimal">.</button>
        <button class="equal" id="equals2">=</button>
    </div>
</div>

<script>
    (function() {
        const display = document.getElementById('display');

        let currentInput = '0';
        let previousInput = '';
        let operator = '';
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function inputDigit(digit) {
            if (shouldResetDisplay) {
                currentInput = digit === '.' ? '0.' : digit;
                shouldResetDisplay = false;
            } else {
                if (digit === '.') {
                    if (currentInput.includes('.')) return;
                    currentInput += '.';
                } else {
                    if (currentInput === '0' && digit !== '.') {
                        currentInput = digit;
                    } else {
                        currentInput += digit;
                    }
                }
            }
            updateDisplay();
        }

        function handleOperator(op) {
            const current = parseFloat(currentInput);
            if (operator && !shouldResetDisplay) {
                const result = calculate(parseFloat(previousInput), current, operator);
                currentInput = String(result);
                updateDisplay();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
        }

        function calculate(a, b, op) {
            let result;
            switch (op) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '×': result = a * b; break;
                case '÷': 
                    if (b === 0) {
                        alert('Tidak bisa dibagi nol!');
                        return a;
                    }
                    result = a / b; 
                    break;
                default: result = b;
            }
            if (typeof result === 'number' && !Number.isInteger(result)) {
                result = parseFloat(result.toPrecision(12));
            }
            return result;
        }

        function handleEquals() {
            if (!operator) return;
            const current = parseFloat(currentInput);
            const result = calculate(parseFloat(previousInput), current, operator);
            currentInput = String(result);
            operator = '';
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = '';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function backspace() {
            if (shouldResetDisplay) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        document.querySelector('.buttons').addEventListener('click', function(e) {
            const target = e.target;
            if (!target.matches('button')) return;

            const id = target.id;

            if (target.classList.contains('number') || id === 'decimal') {
                if (id === '0') inputDigit('0');
                else if (id === '1') inputDigit('1');
                else if (id === '2') inputDigit('2');
                else if (id === '3') inputDigit('3');
                else if (id === '4') inputDigit('4');
                else if (id === '5') inputDigit('5');
                else if (id === '6') inputDigit('6');
                else if (id === '7') inputDigit('7');
                else if (id === '8') inputDigit('8');
                else if (id === '9') inputDigit('9');
                else if (id === 'decimal') inputDigit('.');
                return;
            }

            // Operator 
            if (id === 'add') handleOperator('+');
            else if (id === 'subtract') handleOperator('-');
            else if (id === 'multiply') handleOperator('×');
            else if (id === 'divide') handleOperator('÷');
            else if (id === 'equals' || id === 'equals2') handleEquals();
            else if (id === 'clear') clearAll();
            else if (id === 'backspace') backspace();
        });

        updateDisplay();

        // Keyboard 
        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (key >= '0' && key <= '9') {
                e.preventDefault();
                inputDigit(key);
            } else if (key === '.') {
                e.preventDefault();
                inputDigit('.');
            } else if (key === '+') {
                e.preventDefault();
                handleOperator('+');
            } else if (key === '-') {
                e.preventDefault();
                handleOperator('-');
            } else if (key === '*') {
                e.preventDefault();
                handleOperator('×');
            } else if (key === '/') {
                e.preventDefault();
                handleOperator('÷');
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                handleEquals();
            } else if (key === 'Backspace') {
                e.preventDefault();
                backspace();
            } else if (key === 'Escape') {
                e.preventDefault();
                clearAll();
            }
        });
    })();
</script>

</body>
</html>
